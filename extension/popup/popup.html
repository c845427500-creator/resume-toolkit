<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>简历库助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>🌰 简历库助手</h1>
      <div class="header-actions">
        <button id="matchBtn" class="text-btn primary-btn">一键匹配</button>
        <button id="syncBtn" class="text-btn">同步</button>
      </div>
    </div>
    <div id="statusBar" class="status-bar hidden"></div>
    <div id="dirTabs" class="dir-tabs hidden"></div>
    <div class="content">
      <div id="loading" class="loading">加载中...</div>
      <div id="empty" class="empty hidden">暂无数据，请先同步简历库</div>
      <div id="sections" class="sections hidden"></div>
    </div>
    <div class="footer">标签点击填单项 · 一键匹配填全页 · 来自 简历工具箱</div>
  </div>
  <script src="../lib/data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
