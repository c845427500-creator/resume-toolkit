<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>简历库助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>🌰 简历库助手</h1>
      <div class="header-actions">
        <button id="importBtn" class="text-btn">导入</button>
        <button id="syncBtn" class="text-btn">同步</button>
      </div>
    </div>
    <div id="statusBar" class="status-bar hidden"></div>
    <div id="dirTabs" class="dir-tabs hidden"></div>
    <div class="content">
      <div id="loading" class="loading">加载中...</div>
      <div id="empty" class="empty hidden">暂无数据，点击「导入」或「同步」</div>
      <div id="sections" class="sections hidden"></div>
    </div>
    <div class="footer">点击条目 → 填入网页当前输入框 · 下拉框自动匹配 · 来自 简历工具箱</div>
    <input type="file" id="fileInput" accept=".json" class="hidden">
  </div>
  <script src="../lib/data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
